name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, or container / container-test for a manual image build'
        required: true
        type: string
jobs:
  container:
    if: inputs.tag == 'container' || inputs.tag == 'container-test'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: dev
      publish: ${{ inputs.tag == 'container' }}
  release:
    if: inputs.tag != 'container' && inputs.tag != 'container-test'
    permissions: write-all
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5.1.0
        with:
          global-json-file: global.json
      - name: Install dependencies
        run: dotnet restore --locked-mode
      - name: Publish
        run: |
          dotnet build --configuration Release --no-restore
          dotnet publish SS14.Watchdog/SS14.Watchdog.csproj --configuration Release --runtime linux-x64 --self-contained false --no-restore -o dist
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore --verbosity normal
      - name: Zip release
        run: |
          cd dist
          zip -r ../dist.zip .
      - name: Create Release
        run: gh release create "${{ github.event.inputs.tag }}" -t "${{ github.event.inputs.tag }}" dist.zip
