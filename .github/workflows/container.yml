name: Manual container build
on:
  workflow_call:
    inputs:
      tag:
        default: dev
        type: string
      publish:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Additional image tag
        default: dev
        required: true
        type: string
      publish:
        description: Publish the tested image to GHCR
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.sha }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=${{ inputs.tag }}
      - name: Check for an already published commit
        id: existing
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ] && docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container before publication
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
        run: |
          printf 'Servers:\n  Instances: {}\n' > "$RUNNER_TEMP/watchdog-container.yml"
          docker run --detach --name watchdog-smoke --publish 127.0.0.1:5501:5000 \
            --mount "type=bind,source=$RUNNER_TEMP/watchdog-container.yml,target=/data/appsettings.yml,readonly" \
            "$IMAGE:sha-$GITHUB_SHA"
          trap 'docker logs watchdog-smoke; docker rm --force watchdog-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5501/watchdog/padlock; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Publish the tested image or tag the existing commit
        if: inputs.publish
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE: ${{ steps.existing.outputs.image }}
          EXISTING: ${{ steps.existing.outputs.found }}
        run: |
          while IFS= read -r tag; do
            if [ "$EXISTING" = true ]; then
              docker buildx imagetools create --tag "$tag" "$IMAGE:sha-$GITHUB_SHA"
            else
              docker push "$tag"
            fi
          done <<< "$TAGS"
