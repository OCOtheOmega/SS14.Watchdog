Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft: Warning
  WriteTo:
    - Name: Console

Data:
  File: /data/data.db
Process:
  PersistServers: false
Servers:
  InstanceRoot: /data/instances
  Instances:
    main:
      Name: SS14
      ApiPort: 1212
      StartupTimeoutSeconds: 180
      TimeoutSeconds: 90
      UpdateRestart:
        Mode: Countdown
        CountdownSeconds: 600
        ShutdownTimeoutSeconds: 120
      UpdateType: Manifest
      Updates:
        ManifestUrl: https://wizards.cdn.spacestation14.com/fork/wizards/manifest
